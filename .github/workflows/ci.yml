name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # onnxruntime-node's postinstall downloads native binaries the browser
      # build never uses; skip install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build:pwa
      - run: pnpm audit --prod

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @openquest/worker exec wrangler deploy --dry-run

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        working-directory: apps/companion
        run: gradle --no-daemon assembleDebug
